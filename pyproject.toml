[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-brain"
version = "0.1.0"
description = "Obsidian RAG knowledge base backend — Git sync, hybrid retrieval, MCP endpoint"
requires-python = ">=3.12"
authors = [
    {name = "KB Team"},
]
dependencies = [
    # web / api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # mcp
    "mcp>=1.27",
    # db
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    # pgvector SQLAlchemy type — the `Vector` used by chunks.embedding
    "pgvector>=0.5",
    # config
    "pydantic-settings>=2.5",
    # converter
    "markitdown>=0.1",
    # embedding
    "httpx>=0.27",
    "numpy>=2.0",
    # chunking
    "jieba>=0.42",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a real PostgreSQL container (see tests/integration/conftest.py)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
