# 本地与单机部署栈（spec §10）。
#
# 三个服务：自建 PG（pgvector + zhparser）、api、worker。api 与 worker 用同一
# 镜像、同一份配置，只有 command 不同 —— 这是 spec §4「一份代码两个入口」的字面实现。
#
# 用法：
#   docker compose build
#   docker compose up -d
#   docker compose exec api alembic upgrade head
#
# 首次启动前需要 .env（cp .env.example .env 并填 EMBEDDING_API_KEY）。
#
# ⚠️ 生产必须在自己前面放一个 HTTPS 终结器（反向代理 / 负载均衡）。
#    bearer token 走明文 HTTP 等于把知识库公开 —— spec §9。

name: knowledge-brain

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile.app
  image: kb-app:local
  env_file:
    - .env
  environment:
    # 容器内互相访问用的是服务名，不是 localhost —— .env 里写的是宿主机视角。
    DATABASE_URL: postgresql+asyncpg://kb_app:${KB_APP_PASSWORD:-kb_app_pw}@postgres:5432/${POSTGRES_DB:-kb}
    DATABASE_URL_ADMIN: postgresql+asyncpg://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-kb}@postgres:5432/${POSTGRES_DB:-kb}
    DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-kb}@postgres:5432/${POSTGRES_DB:-kb}
  volumes:
    - kbdata:/data
  depends_on:
    postgres:
      # 等到真正能接受连接，而不是仅仅容器起来了 —— 否则第一次查询会拍在
      # "the database system is starting up" 上。
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
      args:
        PG_MAJOR: ${PG_MAJOR:-17}
    image: kb-postgres:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb}
      POSTGRES_DB: ${POSTGRES_DB:-kb}
      # Password handed to the unprivileged `kb_app` role on first init.
      # Local development only — override it anywhere real.
      KB_APP_PASSWORD: ${KB_APP_PASSWORD:-kb_app_pw}
    ports:
      # Exposed so Alembic and pytest can reach it from the host/WSL side.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `alembic upgrade head` must wait for this, not just for the container.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb} -d ${POSTGRES_DB:-kb}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    <<: *app
    command: ["kb", "serve"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # /api/health is deliberately unauthenticated and does not touch the
      # database, so this reports "is the process serving" and nothing else.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["kb", "worker"]
    # No port: the worker speaks to Postgres and to git remotes, nothing else.
    healthcheck:
      test: ["CMD-SHELL", "kb --help >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  # Uploaded originals and the bare partial clones. Losing this costs a re-clone
  # and a re-upload, not correctness (spec §5: the index is a derivative) — but
  # it is still the only copy of uploaded files, so it is worth persisting.
  kbdata:
